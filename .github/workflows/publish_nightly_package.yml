---
# Publish nightly package to PyPI

name: Publish Nightly Package to PyPI

on:
  workflow_call:
    inputs:
      commit_id:
        required: false
        type: string
    secrets:
      PYPI_API_TOKEN:
        required: false
    outputs:
      version:
        description: "Version of the nightly package"
        value: ${{ jobs.publish_package.outputs.version }}
  workflow_dispatch:
    inputs:
      commit_id:
        required: false
        type: string
        description: "Commit ID to use for the nightly build"

env:
  COMMIT_ID: ${{ inputs.commit_id || github.sha }} # use commit_id from the calling workflow

permissions:
  id-token: write

jobs:
  publish_package:
    name: Publish Nightly Package
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.modify_setup.outputs.VERSION }}
    environment: dev
    if: |
      (github.event_name == 'schedule' && github.repository_owner == 'securefederatedai') ||
      (github.event_name == 'workflow_dispatch')
    steps:
    - name: Checkout OpenFL repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.COMMIT_ID }}

    - name: Modify setup.py for nightly build
      id: modify_setup
      run: echo "VERSION=1.9.0.dev20250410" >> "$GITHUB_OUTPUT"
        # echo "Creating package..."
        # version=$(grep -oP "(?<=version=')[^']+" setup.py)
        # date_suffix=$(date +%Y%m%d)
        # new_version="${version}${date_suffix}"
